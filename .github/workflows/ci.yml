# CI: frontend type-check + build, and Linux Rust check.
# Cross-platform Tauri builds + signing land in M6.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Surface new transitive vulnerabilities as soon as they land in
      # the advisory database. --prod scopes to the runtime bundle so
      # build-only tools (vitest, vite, shadcn-CLI) don't trigger
      # unrelated noise.
      - name: pnpm audit (prod)
        run: pnpm audit --prod

  rust:
    name: Rust check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # --locked enforces that src-tauri/Cargo.lock is up to date with
      # Cargo.toml. The lockfile is committed and can be refreshed via the
      # refresh-cargo-lock.yml workflow (manual workflow_dispatch).
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Rust-side advisory check via cargo-audit. Currently scans
      # 636 deps against ~1090 advisories. The Tauri 2 Linux dep
      # chain pulls in 10+ "unmaintained" gtk-rs warnings that we
      # cannot fix without forking Tauri; --ignore RUSTSEC-2024-0370
      # etc. would catalog them, but until upstream Tauri migrates
      # to gtk4 we tolerate the noise and fail only on actual CVEs
      # via --deny vulnerabilities (the default).
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "^0.22"
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny vulnerabilities
