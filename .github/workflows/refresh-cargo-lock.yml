# One-shot workflow to (re)generate src-tauri/Cargo.lock and commit it
# back to main. Trigger manually from the GitHub Actions UI whenever a
# Cargo.toml change requires the lockfile to be refreshed.
name: Refresh Cargo.lock

on:
  workflow_dispatch:

concurrency:
  group: refresh-cargo-lock
  cancel-in-progress: false

jobs:
  refresh:
    name: Generate and commit src-tauri/Cargo.lock
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Check for lockfile changes
        id: check
        run: |
          if [ -n "$(git status --porcelain src-tauri/Cargo.lock)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock has changes; commit step will run."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cargo.lock already current; no commit needed."
          fi

      - name: Commit refreshed Cargo.lock
        if: steps.check.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): refresh src-tauri/Cargo.lock via workflow_dispatch"
          file_pattern: src-tauri/Cargo.lock
          branch: main
