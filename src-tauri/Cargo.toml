[package]
name = "teraxlyst"
version = "0.1.0-rc4"
description = "Teraxlyst: a desktop workspace for AI coding agents. Forked from terax-ai v0.6.5."
authors = ["ademczuk"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ademczuk/Teraxlyst"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "teraxlyst_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
dirs = "5"
log = "0.4"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
shared_child = "1"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
reqwest = { version = "0.12", default-features = false, features = [
	"rustls-tls",
	"stream",
] }
bytes = "1"
futures-util = "0.3"
rusqlite = { version = "0.39", features = ["bundled", "serde_json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-util"] }
thiserror = "1"
ulid = { version = "1", features = ["serde"] }
# MCP host (M3). server + transport-io enables stdio transport. macros and
# schemars are enabled by default and we use both.
rmcp = { version = "1.7", default-features = true, features = ["server", "transport-io"] }
schemars = "1"
# Unified-diff computation for propose_diff.
similar = "2"
# YAML parser for M4 trackers. Maintained fork of dtolnay's serde_yaml,
# which was deprecated in 2024. serde_yaml_ng tracks the original API
# exactly so we can swap forks later without code churn.
serde_yaml_ng = "0.10"

[features]
# Off-by-default feature for the rmcp stdio wire-protocol surface in
# src/mcp/server.rs (spawn_stdio_server). M3 ships the in-process toolset
# only; the stdio bridge is a future productionization step.
mcp-stdio = []

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "test-util", "time"] }
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"apple-native",
] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
	"windows-native",
] }
windows-sys = { version = "0.59", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = true
